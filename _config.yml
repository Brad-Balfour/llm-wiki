title: LLM Wiki
description: A provenance-first personal knowledge base compiled from reviewed sources.
theme: jekyll-theme-minimal
markdown: kramdown
defaults:
  - scope:
      path: wiki
    values:
      layout: default
exclude:
  - AGENTS.md
  - chatgpt-project
  - dist
  - docs
  - node_modules
  - openspec
  - package-lock.json
  - package.json
  - schema
  - sources
  - src
  - tests
  - tsconfig.json
  - wiki/ENTRY_TEMPLATE.md
